name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Flutter project
        id: locate
        run: |
          if [ -f mobile/pubspec.yaml ]; then
            echo "dir=mobile" >> $GITHUB_OUTPUT
          elif [ -f pubspec.yaml ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          else
            echo "Flutter pubspec.yaml not found!"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter pub get
        
      - name: Generate Android project
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter create --platforms=android .

      - name: Add Internet Permission
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          python3 - <<'PY'
          import re

          path = "android/app/src/main/AndroidManifest.xml"

          with open(path, "r") as f:
              content = f.read()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if "android.permission.INTERNET" not in content:
              content = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    ' + permission,
                  content,
                  count=1
              )

          with open(path, "w") as f:
              f.write(content)

          print("Internet permission added successfully.")
          PY
          
        
      - name: Build APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-AI-App-APK
          path: ${{ steps.locate.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
